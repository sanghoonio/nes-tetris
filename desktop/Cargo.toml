[package]
name = "desktop"
version = "0.1.0"
edition = "2021"
publish = false
description = "The desktop app: the readable game in a window, with settings, saved scores and your ROM's data built in"

[[bin]]
name = "tetris"
path = "src/main.rs"

[dependencies]
client = { path = "../client" }
tetris-rs = { path = "../tetris-rs" }
frontend = { path = "../frontend" }
dirs = "6"
toml = "0.9"

[features]
# VERSUS: matches through a room, over the network.
versus = ["client/versus"]

[build-dependencies]
sha1_smol = "1"
