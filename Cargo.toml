[workspace]
resolver = "2"
members = ["apu", "crossplay", "desktop", "frontend", "ppu", "netplay", "probe", "protocol", "recomp", "tetris-rs"]
# `cargo build` / `cargo run` build just the game; the recompile needs code generated from the
# ROM first (recomp/gen/gen.py), so it's built only when asked for (-p recomp, --workspace).
default-members = ["desktop"]
# The Cloudflare Worker builds only for the Workers runtime; it has its own workspace.
exclude = ["server"]

# Tests run the reference emulator and thousands of frames, so even dev builds are optimised.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
