[package]
name = "netplay"
version = "0.1.0"
edition = "2021"
publish = false
description = "The client side of an online match: your game, replicas of the others, and the messages, with no UI or networking"

[dependencies]
protocol = { path = "../protocol" }
tetris-rs = { path = "../tetris-rs" }

# The websocket and the local room server, for native clients.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]

# The websockets in a browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "CloseEvent", "Event"] }
