[package]
name = "tetris-rs"
version = "0.1.0"
edition = "2021"
publish = false
description = "NES Tetris reimplemented in readable Rust, verified against the recompile"

[dependencies]
apu = { path = "../apu" }
ppu = { path = "../ppu" }
sha1_smol = "1"

# The desktop window, for the `tetris` binary.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
frontend = { path = "../frontend" }

[build-dependencies]
sha1_smol = "1"

[dev-dependencies]
recomp = { path = "../recomp" }
