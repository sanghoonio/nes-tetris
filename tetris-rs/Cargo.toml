[package]
name = "tetris-rs"
version = "0.1.0"
edition = "2021"
publish = false
description = "NES Tetris reimplemented in readable Rust, verified against the recompile"

[dependencies]
apu = { path = "../apu" }
ppu = { path = "../ppu" }
sha1_smol = "1"

# The desktop window and the settings file, for the `tetris` binary.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
frontend = { path = "../frontend" }
dirs = "6"
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[features]
# `build.rs` builds the data of your ROM into the package, for the `tetris` binary. Without it
# the package builds with no ROM, for a program that hands the game a ROM at runtime
# (`Rom::new`), e.g. in a browser.
default = ["embedded-rom"]
embedded-rom = []

[[bin]]
name = "tetris"
path = "src/bin/tetris/main.rs"
required-features = ["embedded-rom"]

[build-dependencies]
sha1_smol = "1"

[dev-dependencies]
recomp = { path = "../recomp" }
