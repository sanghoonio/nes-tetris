[package]
name = "engine"
version = "0.1.0"
edition = "2021"
publish = false
description = "The app (client, with VERSUS) as WebAssembly for the web page: wasm-bindgen exports"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
client = { path = "../../client", features = ["versus"] }
tetris-rs = { path = "../../tetris-rs" }
ppu = { path = "../../ppu" }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3

# Built only for WebAssembly (wasm-pack, from ../package.json), so it's its own workspace.
[workspace]
