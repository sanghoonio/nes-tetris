name = "nes-tetris"
main = "build/index.js"
compatibility_date = "2026-10-01"

# The server, then the web page it serves (`../web`, built to `../web/dist`).
[build]
command = "cargo install -q \"worker-build@^0.8\" && worker-build --release && cd ../web && npm install --silent && npm run build"

# At nes-tetris.online (registered with Cloudflare, so the deploy makes its DNS record and
# certificate), and still at nes-tetris.sanghoonio.workers.dev, which builds before the domain
# connect to. Both reach the same rooms.
workers_dev = true

[[routes]]
pattern = "nes-tetris.online"
custom_domain = true

# The page and its files; requests for anything else (/new, /room/<code>, /rooms) reach the server.
[assets]
directory = "../web/dist"

[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "RoomObject" },
  { name = "DIRECTORY", class_name = "DirectoryObject" },
]

# Workers Logs: errors, panics and the warnings in src/lib.rs, kept a few days, in the dashboard
# (Workers > nes-tetris > Logs). The free plan keeps up to 200,000 a day.
[observability]
enabled = true

# New connections per address (CF-Connecting-IP), per minute: 30. Counted per Cloudflare location.
[[ratelimits]]
name = "CONNECTS"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# The free plan has SQLite-backed Durable Objects only.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["DirectoryObject"]
